name: Save 9:45 GEX levels

on:
  schedule:
    - cron: "45 13 * * 1-5"   # 9:45 ET while daylight saving time is in effect
    - cron: "45 14 * * 1-5"   # 9:45 ET during standard time (the script skips the extra run)
  workflow_dispatch:           # adds a "Run workflow" button for testing

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Save levels
        run: python snapshot.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
      - name: Commit the new file
        run: |
          git config user.name "gex-snapshot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add snapshots
          git diff --cached --quiet || (git commit -m "9:45 levels $(date +%F)" && git push)
